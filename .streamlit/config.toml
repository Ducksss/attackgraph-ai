# Theme after the Close CRM template: light greys, Inter, indigo accent.
[theme]
base = "light"
primaryColor = "#6366f1"
backgroundColor = "#f9f9fa"
secondaryBackgroundColor = "#f4f4f6"
textColor = "#111114"
borderColor = "#e2e2e8"
dataframeBorderColor = "#e2e2e8"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = 500
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
linkColor = "#4044f0"
greenColor = "#16a34a"
orangeColor = "#d97706"
redColor = "#dc2626"
codeTextColor = "#4338ca"
codeBackgroundColor = "#f4f4f6"

[server]
headless = true
maxUploadSize = 2

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
